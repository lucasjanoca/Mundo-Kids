name: Corrigir menu ADM e carrinho autenticado

on:
  push:
    paths:
      - '.github/workflows/fix-menu-auth.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Aplicar correcoes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          # 1) Menu lateral do ADM abre pelo mesmo lado do botao (direita) no mobile/tablet.
          admin_path = Path('admin.html')
          admin = admin_path.read_text(encoding='utf-8')
          old_admin = 'position:fixed;left:0;top:0;bottom:0;width:min(290px,84vw);height:100dvh;transform:translateX(-110%);transition:transform .25s ease;box-shadow:0 24px 60px rgba(16,50,83,.24)'
          new_admin = 'position:fixed;right:0;left:auto;top:0;bottom:0;width:min(290px,84vw);height:100dvh;transform:translateX(110%);border-right:0;border-left:1px solid var(--line);transition:transform .25s ease;box-shadow:0 24px 60px rgba(16,50,83,.24)'
          if old_admin not in admin:
              raise SystemExit('Padrao do menu ADM nao encontrado; nenhuma alteracao foi feita.')
          admin = admin.replace(old_admin, new_admin, 1)
          admin_path.write_text(admin, encoding='utf-8')

          # 2) Carrinho so aceita inclusao de produto quando existe sessao autenticada.
          index_path = Path('index.html')
          index = index_path.read_text(encoding='utf-8')

          old_continue = 'async function continuePending(){const action=pendingAction||localStorage.getItem("mk_pending_auth_action");pendingAction=null;localStorage.removeItem("mk_pending_auth_action");if(action==="checkout"){openCart();startCheckout()}else if(action==="track"){openMyOrders()}else if(action==="account"){openMyOrders()}}'
          new_continue = 'async function continuePending(){const action=pendingAction||localStorage.getItem("mk_pending_auth_action");pendingAction=null;localStorage.removeItem("mk_pending_auth_action");if(action==="checkout"){openCart();startCheckout()}else if(action==="track"){openMyOrders()}else if(action==="account"){openMyOrders()}else if(action&&action.startsWith("cart:")){const id=action.slice(5);const added=await addCart(id);if(added){if($("#productModal").open)$("#productModal").close();openCart()}}}'
          if old_continue not in index:
              raise SystemExit('Padrao continuePending nao encontrado.')
          index = index.replace(old_continue, new_continue, 1)

          old_add = 'function addCart(id,qty=1){const p=products.find(x=>x.id===id);if(!p)return;cart[id]=Math.min(20,(cart[id]||0)+qty);saveCart();renderCart();track("add_cart",id);toast(p.name+" adicionado ao pedido.")}'
          new_add = 'async function addCart(id,qty=1){if(!(await requireCustomer("cart:"+id)))return false;const p=products.find(x=>x.id===id);if(!p)return false;cart[id]=Math.min(20,(cart[id]||0)+qty);saveCart();renderCart();track("add_cart",id);toast(p.name+" adicionado ao pedido.");return true}'
          if old_add not in index:
              raise SystemExit('Padrao addCart nao encontrado.')
          index = index.replace(old_add, new_add, 1)

          old_modal = '$("#addProduct").onclick=()=>{if(selected){addCart(selected.id);$("#productModal").close();openCart()}};'
          new_modal = '$("#addProduct").onclick=async()=>{if(selected&&await addCart(selected.id)){$("#productModal").close();openCart()}};'
          if old_modal not in index:
              raise SystemExit('Padrao do botao do modal nao encontrado.')
          index = index.replace(old_modal, new_modal, 1)

          # Evita reaproveitar carrinho anonimo antigo em uma visita sem sessao.
          old_boot = '(async()=>{await refreshCustomerSession();if(customerSession){await loadAccount();const p=localStorage.getItem("mk_pending_auth_action");if(p){pendingAction=p;await continuePending()}}})();'
          new_boot = '(async()=>{await refreshCustomerSession();if(customerSession){await loadAccount();const p=localStorage.getItem("mk_pending_auth_action");if(p){pendingAction=p;await continuePending()}}else{cart={};localStorage.removeItem("mk_order_cart");updateCartCount();renderCart()}})();'
          if old_boot not in index:
              raise SystemExit('Padrao de inicializacao da sessao nao encontrado.')
          index = index.replace(old_boot, new_boot, 1)

          # Ao sair, remove o carrinho local para nao misturar contas no mesmo aparelho.
          old_logout = '$("#customerLogout").onclick=async()=>{await authDb.auth.signOut();customerSession=null;$("#trackModal").close();toast("Você saiu da sua conta.")};'
          new_logout = '$("#customerLogout").onclick=async()=>{await authDb.auth.signOut();customerSession=null;cart={};localStorage.removeItem("mk_order_cart");updateCartCount();renderCart();$("#trackModal").close();toast("Você saiu da sua conta.")};'
          if old_logout not in index:
              raise SystemExit('Padrao de logout nao encontrado.')
          index = index.replace(old_logout, new_logout, 1)

          index_path.write_text(index, encoding='utf-8')

          # Testes estaticos para garantir que as duas regras ficaram aplicadas.
          checks = [
              ('menu ADM pela direita', 'right:0;left:auto' in admin and 'transform:translateX(110%)' in admin),
              ('carrinho exige sessao', 'await requireCustomer("cart:"+id)' in index),
              ('produto pendente volta apos login', 'action.startsWith("cart:")' in index),
              ('carrinho anonimo antigo e limpo', 'localStorage.removeItem("mk_order_cart")' in index),
          ]
          failed = [name for name, ok in checks if not ok]
          if failed:
              raise SystemExit('Falharam os testes: ' + ', '.join(failed))
          print('OK - correcoes e testes aplicados com sucesso.')
          PY

      - name: Commit das correcoes
        shell: bash
        run: |
          if git diff --quiet -- admin.html index.html; then
            echo 'Nenhuma alteracao pendente.'
            exit 0
          fi
          git config user.name 'InfoTech Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add admin.html index.html
          git commit -m 'fix: menu ADM pela direita e carrinho somente com conta'
          git push
